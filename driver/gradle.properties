# The test dependencies (androidx.test, uiautomator) are AndroidX, and AGP
# refuses to resolve them without this. There is no support-library history
# here to migrate -- the flag is simply required.
android.useAndroidX=true
# The driver is one tiny module; a background daemon and parallel execution
# buy nothing and keep a JVM resident after an install script has finished.
org.gradle.daemon=false
